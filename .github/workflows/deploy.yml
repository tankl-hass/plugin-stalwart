name: Deploy cloud-stalwart front door

# The Worker is optional. It declares no route and disables workers.dev, so it
# has no public hostname; deploying it only publishes an unreachable script
# until a trusted caller is wired up. jadmin.<DOMAIN> stays on the tunnel.
on:
  push:
    branches: [devl, main]
  workflow_dispatch:

concurrency:
  group: cloud-stalwart-deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: ${{ secrets.DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate domain secret
        run: |
          if [ -z "$DOMAIN" ]; then
            echo "::error::DOMAIN secret is required (the base domain, e.g. example.com)"
            exit 1
          fi
          if ! printf '%s' "$DOMAIN" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$' \
            || [[ "$DOMAIN" == *..* ]] || [[ "$DOMAIN" != *.* ]] \
            || [[ "$DOMAIN" == jadmin.* ]]; then
            echo "::error::DOMAIN must be a bare base domain such as example.com (no scheme, path or 'jadmin.' host)."
            exit 1
          fi
      - name: Render deploy config
        run: sed "s|\${DOMAIN}|${DOMAIN}|g" wrangler-action.toml > wrangler.deploy.toml
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.deploy.toml
