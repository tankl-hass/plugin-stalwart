name: CI cloud-stalwart

on:
  pull_request:
  push:
    branches: [devl, main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Validate deploy template renders
        env:
          DOMAIN: example.com
        run: |
          sed "s|\${DOMAIN}|${DOMAIN}|g" wrangler-action.toml > wrangler.deploy.toml
          npx wrangler deploy --dry-run -c wrangler.deploy.toml --outdir dist
